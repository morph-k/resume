<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved — Morphy Kuffour's Resume</title>

    <!-- The resume now lives under the blog. Keep the old Pages URL working
         for anything that already links here: search engines follow both the
         zero-delay refresh and the canonical, and the visible link covers
         clients that honour neither. resume.pdf stays in this repository so
         direct links to the file keep resolving. -->
    <link rel="canonical" href="https://morphykuffour.github.io/resume/" />
    <meta http-equiv="refresh" content="0; url=https://morphykuffour.github.io/resume/" />

    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        main {
            max-width: 32rem;
            text-align: center;
        }

        p {
            margin: 0 0 .75rem;
        }

        .muted {
            font-size: .875rem;
            opacity: .7;
        }
    </style>
</head>

<body>
    <main>
        <p>This resume has moved to
            <a href="https://morphykuffour.github.io/resume/">morphykuffour.github.io/resume</a>.
        </p>
        <p class="muted">You should be redirected automatically. If not, follow the link above.</p>
    </main>

    <script>
        // replace() rather than assign() so the redirect does not trap the
        // back button on this page.
        location.replace("https://morphykuffour.github.io/resume/");
    </script>
</body>

</html>
